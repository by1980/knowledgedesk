<!doctype html>
<!--
  Cortex sign-in return page.
  Put this ONE file on your company website, e.g. https://connect.yourcompany.com/oauth.html
  (any https address you control works). Google and Microsoft send the customer's browser here after
  they approve; this page forwards the browser back to the customer's own Cortex server.
  It contains no secrets and stores nothing.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Connecting…</title>
  <style>body{font-family:system-ui,sans-serif;max-width:520px;margin:15vh auto;padding:16px;color:#1d2330}</style>
</head>
<body>
  <p id="msg">Connecting your account…</p>
  <script>
    (function () {
      var msg = document.getElementById("msg");
      try {
        var params = new URLSearchParams(window.location.search);
        var state = params.get("state") || "";
        var json = atob(state.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((state.length + 3) % 4));
        var target = JSON.parse(json).r || "";
        // Only forward to a plain web address (scheme + host + optional port), never anywhere else.
        if (!/^https?:\/\/[A-Za-z0-9.\-]+(:\d{1,5})?$/.test(target)) throw new Error("bad target");
        window.location.replace(target + "/oauth/callback" + window.location.search);
      } catch (e) {
        msg.textContent = "This link is not valid. Please start the connection again from Cortex.";
      }
    })();
  </script>
</body>
</html>
